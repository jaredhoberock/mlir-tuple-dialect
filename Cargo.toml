[package]
name = "mlir-tuple-dialect"
version = "0.2.0"
edition = "2024"
links = "tuple_dialect"

[dependencies]
melior = "0.28.2"
mlir-sys = "230.0.2"
trait_dialect = { git = "ssh://git@github.com/jaredhoberock/mlir-trait-dialect.git", package = "mlir-trait-dialect" }
lowering_driver = { git = "ssh://git@github.com/jaredhoberock/mlir-lowering-driver.git", package = "mlir-lowering-driver" }

[build-dependencies]
build-support = { git = "ssh://git@github.com/jaredhoberock/mlir-lowering-driver.git", package = "build-support" }

[lib]
name = "tuple_dialect"
path = "src/lib.rs"

[dev-dependencies]
build-support = { git = "ssh://git@github.com/jaredhoberock/mlir-lowering-driver.git", package = "build-support" }
inline_dialect = { git = "ssh://git@github.com/jaredhoberock/mlir-inline-dialect.git", package = "mlir-inline-dialect" }
