[package]
name = "mlir-tuple-dialect"
version = "0.2.0"
edition = "2024"
links = "tuple_dialect"

[dependencies]
melior = "0.28.2"
mlir-sys = "230.0.2"
trait_dialect = { path = "../mlir-trait-dialect", package = "mlir-trait-dialect" }
lowering_driver = { path = "../mlir-lowering-driver", package = "mlir-lowering-driver" }

[lib]
name = "tuple_dialect"
path = "src/lib.rs"

[dev-dependencies]
inline_dialect = { path = "../mlir-inline-dialect", package = "mlir-inline-dialect" }
